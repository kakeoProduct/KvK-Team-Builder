<h1>KvK占領戦 勝利判定ツール</h1>
<div class="sub">各同盟の占領時間を入力すると、勝利確定までに必要な残り占領時間（分）を自動計算します。</div>

<div class="card">
  <div class="settings-row">
    <label>試合時間：</label>
    <input type="number" id="matchHours" value="5" min="0" step="0.5">
    <span>時間（変更可）</span>
  </div>
</div>

<div class="card">
  <h2>占領時間を入力してください</h2>
  <table id="allianceTable">
    <thead>
      <tr>
        <th style="text-align:left;">同盟</th>
        <th>時(H)</th>
        <th>分(M)</th>
        <th>秒(S)</th>
        <th>合計(秒)</th>
        <th>占領時間</th>
        <th>確定まで</th>
      </tr>
    </thead>
    <tbody id="allianceBody"></tbody>
    <tfoot>
      <tr class="summary">
        <td class="name-col">合計経過</td>
        <td colspan="3"></td>
        <td id="totalSec"></td>
        <td id="totalTime"></td>
        <td></td>
      </tr>
      <tr class="summary">
        <td class="name-col">残り時間</td>
        <td colspan="3"></td>
        <td id="remainSec"></td>
        <td id="remainTime"></td>
        <td></td>
      </tr>
    </tfoot>
  </table>
  <div class="note">※ 時・分・秒に入力 / 同盟名は直接編集可 / 「確定まで」は勝利確定までに必要な残り占領時間（分）</div>
</div>

<script>
const DEFAULT_ALLIANCES = [
  { name: "こぐま", h: 2, m: 17, s: 12 },
  { name: "相手メイン", h: 0, m: 37, s: 34 },
  { name: "999", h: 0, m: 15, s: 3 },
  { name: "相手ゴースト", h: 0, m: 10, s: 16 },
  { name: "その他", h: 0, m: 0, s: 0 },
];

const allianceBody = document.getElementById("allianceBody");
const matchHoursInput = document.getElementById("matchHours");

// --- 入力値の自動保存（このブラウザのみ） ---
const STORAGE_KEY = "kvkOccupationState";

function loadSavedState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveState() {
  try {
    const alliances = Array.from(allianceBody.querySelectorAll("tr")).map(tr => ({
      name: tr.querySelector(".name-input").value,
      h: tr.querySelector(".h-input").value,
      m: tr.querySelector(".m-input").value,
      s: tr.querySelector(".s-input").value,
    }));
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ matchHours: matchHoursInput.value, alliances }));
  } catch (e) {}
}

function formatHMS(totalSec) {
  const sec = Math.max(0, Math.round(totalSec));
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
}

function renderRows(alliances) {
  allianceBody.innerHTML = "";
  alliances.forEach((a, i) => {
    const tr = document.createElement("tr");
    tr.dataset.index = i;
    tr.innerHTML = `
      <td class="name-col"><input type="text" class="name-input" value="${a.name}"></td>
      <td><input type="number" class="h-input" value="${a.h}" min="0"></td>
      <td><input type="number" class="m-input" value="${a.m}" min="0" max="59"></td>
      <td><input type="number" class="s-input" value="${a.s}" min="0" max="59"></td>
      <td class="total-sec"></td>
      <td class="occupy-time"></td>
      <td class="until-decided"></td>
    `;
    allianceBody.appendChild(tr);
  });
  allianceBody.querySelectorAll("input").forEach(inp => {
    inp.addEventListener("input", () => { recalc(); saveState(); });
  });
}

function recalc() {
  const rows = Array.from(allianceBody.querySelectorAll("tr"));
  const totals = rows.map(tr => {
    const h = parseFloat(tr.querySelector(".h-input").value) || 0;
    const m = parseFloat(tr.querySelector(".m-input").value) || 0;
    const s = parseFloat(tr.querySelector(".s-input").value) || 0;
    return h * 3600 + m * 60 + s;
  });

  const matchHours = parseFloat(matchHoursInput.value) || 0;
  const totalElapsed = totals.reduce((a, b) => a + b, 0);
  const remain = matchHours * 3600 - totalElapsed;

  const maxVal = Math.max(...totals);
  const leaderCount = totals.filter(v => v === maxVal).length;

  rows.forEach((tr, i) => {
    const f = totals[i];
    tr.querySelector(".total-sec").textContent = f;
    tr.querySelector(".occupy-time").textContent = formatHMS(f);

    // RANK(F,range,0)=1 かどうか（同率1位も1位扱い）＝ leaderCount>=1 かつ f===maxVal
    const isLeader = f === maxVal;
    // 2位以下ならLARGE(...,1)=最大値、1位ならLARGE(...,2)=2番目に大きい値
    let rival;
    if (isLeader) {
      const sorted = [...totals].sort((a, b) => b - a);
      rival = sorted[1] !== undefined ? sorted[1] : 0;
    } else {
      rival = maxVal;
    }

    const gap = rival + Math.max(0, remain) - f;
    const needed = Math.max(0, Math.floor(gap / 2) + 1);

    const cell = tr.querySelector(".until-decided");
    tr.classList.toggle("leader", isLeader);
    if (needed <= 0) {
      cell.textContent = "確定！";
      cell.classList.add("decided");
    } else {
      const minutes = Math.ceil(needed / 60);
      cell.textContent = `${minutes}分`;
      cell.classList.remove("decided");
    }
  });

  document.getElementById("totalSec").textContent = totalElapsed;
  document.getElementById("totalTime").textContent = formatHMS(totalElapsed);
  document.getElementById("remainSec").textContent = Math.round(remain);
  document.getElementById("remainTime").textContent = formatHMS(remain);
}

const savedState = loadSavedState();
if (savedState && Array.isArray(savedState.alliances) && savedState.alliances.length === DEFAULT_ALLIANCES.length) {
  matchHoursInput.value = savedState.matchHours;
  renderRows(savedState.alliances);
} else {
  renderRows(DEFAULT_ALLIANCES);
}
matchHoursInput.addEventListener("input", () => { recalc(); saveState(); });
recalc();
</script>

</body>
